<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --surface-2:#f8f9fb; --line:#e4e7ec; --line-2:#eef0f3;
  --text:#101828; --text-2:#475467; --muted:#98a2b3;
  --accent:#1c5cab; --accent-d:#104281; --accent-l:#e8f0fb; --navy:#0d2a52;
  --hf:#2a78d6; --hcl:#eb6834; --hno3:#1baf7a;
  --good:#0f7b0f; --good-l:#e8f6e8; --warn:#b26b00; --warn-l:#fff4dc; --serious:#c2410c; --bad:#c53030; --bad-l:#fdecec;
  --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
  --r:10px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
.nav{width:224px;flex:none;background:var(--navy);color:#cfd8e6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:20px 18px 16px}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#2a78d6,#1c5cab);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.02em}
.brand-t{font-weight:700;color:#fff;letter-spacing:.01em}
.brand-s{font-size:12px;color:#8fa3c0}
#navlinks{display:flex;flex-direction:column;padding:6px 10px;gap:2px;flex:1}
#navlinks a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;color:#b9c6d9;text-decoration:none;font-weight:500}
#navlinks a:hover{background:rgba(255,255,255,.06);color:#fff}
#navlinks a.on{background:rgba(255,255,255,.12);color:#fff}
#navlinks a .ico{width:18px;text-align:center;opacity:.9}
#navlinks a .cnt{margin-left:auto;background:#d03b3b;color:#fff;font-size:11px;border-radius:10px;padding:0 7px;font-weight:600}
.nav-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px}
.lang-toggle{display:flex;background:rgba(255,255,255,.06);border-radius:8px;padding:2px}
.lang-toggle button{flex:1;border:0;background:none;padding:5px;border-radius:6px;cursor:pointer;font-size:12px;color:#b9c6d9}
.lang-toggle button.on{background:#fff;color:var(--text);font-weight:600}
.light .lang-toggle{background:var(--surface-2);border:1px solid var(--line)} .light .lang-toggle button{color:var(--text-2)} .light .lang-toggle button.on{box-shadow:var(--shadow)}
.who{font-size:12px;color:#b9c6d9;cursor:pointer}
.store-mode{font-size:11px;color:#7d91ad}
main{flex:1;min-width:0;padding:24px 30px 60px}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.01em}
.page-h .sub{color:var(--text-2);font-size:13px}
.sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;padding:14px 18px 0;flex-wrap:wrap}
.card-h h3{margin:0;font-size:14px;font-weight:600}
.card-h .note{font-size:12px;color:var(--muted)}
.card-b{padding:14px 18px 18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--text-2);font-weight:500}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.row2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px}
.row-eq{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(2,1fr)}.row2,.row-eq{grid-template-columns:1fr}}
@media (max-width:900px){.nav{width:62px}.brand div:last-child,#navlinks a span.t,.nav-foot .who,.store-mode{display:none}.lang-toggle{flex-direction:column}main{padding:18px 14px 50px}}
/* chem cards */
.chem-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.chem{padding:18px;position:relative;overflow:hidden}
.chem .top{display:flex;align-items:center;gap:10px}
.chem .tag{font-weight:700;font-size:13px;padding:3px 10px;border-radius:6px;color:#fff}
.chem .po{font-size:13px;color:var(--text-2)}
.chem .body{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center;margin-top:14px}
.chem dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}
.chem dt{color:var(--text-2)} .chem dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.chem .alert{margin-top:12px;font-size:12px;padding:8px 10px;border-radius:8px}
.chem.empty .body{display:block;color:var(--text-2);font-size:13px}
.delta{font-size:12px;font-weight:600}
.delta.dn{color:var(--accent)} .delta.up{color:var(--serious)}
/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text-2);font-weight:500}
.tabs button.on{background:#fff;color:var(--text);box-shadow:var(--shadow);font-weight:600}
/* tables */
.tbl-wrap{overflow:auto;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;color:var(--text-2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
table.t tr:hover td{background:#fafbfc}
table.t .num{text-align:right;font-variant-numeric:tabular-nums}
table.t tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.muted{color:var(--muted)}
.tbl-scroll{max-height:calc(100vh - 230px);overflow:auto}
/* badges */
.b{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;background:#f2f4f7;color:#344054}
.b i{width:7px;height:7px;border-radius:50%;display:inline-block}
.b.good{background:var(--good-l);color:var(--good)} .b.good i{background:var(--st-good)}
.b.warn{background:var(--warn-l);color:var(--warn)} .b.warn i{background:var(--st-warn)}
.b.bad{background:var(--bad-l);color:var(--bad)} .b.bad i{background:var(--st-crit)}
.b.info{background:var(--accent-l);color:var(--accent-d)} .b.info i{background:var(--accent)}
.b.gray i{background:#98a2b3}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-d)}
.btn.danger{color:var(--bad);border-color:#f3c4c4}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
.inp:focus{outline:2px solid var(--accent-l);border-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .inp{height:34px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);cursor:pointer;user-select:none}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 14px}
.form .f{display:flex;flex-direction:column;gap:5px;min-width:0}
.form .inp{width:100%}
.form .f.full{grid-column:1/-1}
.form label{font-size:12px;color:var(--text-2);font-weight:500}
.form .hint{font-size:11px;color:var(--muted)}
.mbg{position:fixed;inset:0;background:rgba(16,24,40,.38);display:flex;align-items:flex-start;justify-content:center;padding:50px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:16px}
.modal-b{padding:18px 20px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);margin-left:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:#b42318}
.warnbox{background:var(--warn-l);border:1px solid #f5d9a3;color:#7a4a00;padding:10px 12px;border-radius:8px;font-size:13px}
.errbox{background:var(--bad-l);border:1px solid #f3c4c4;color:#8a1f1f;padding:10px 12px;border-radius:8px;font-size:13px}
.infobox{background:var(--accent-l);border:1px solid #c8daf3;color:var(--accent-d);padding:10px 12px;border-radius:8px;font-size:13px}
.empty-st{padding:40px 20px;text-align:center;color:var(--text-2)}
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:80}
.gate-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:34px 36px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow)}
.gate-card h2{margin:0 0 8px;font-size:19px} .gate-card p{color:var(--text-2);font-size:13px;margin:0 0 20px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
/* chart */
svg.ch{display:block;width:100%;height:auto;overflow:visible}
svg.ch text{font-family:Inter,"Noto Sans KR",sans-serif}
svg.ch text.halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.hit{fill:transparent;cursor:crosshair}
#tip{position:fixed;pointer-events:none;background:#101828;color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;z-index:90;box-shadow:0 6px 18px rgba(0,0,0,.18);line-height:1.5;display:none;max-width:280px}
#tip b{font-weight:600}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--text-2);margin-top:8px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{display:inline-block;width:14px;height:0;border-top:2px solid}
.leg i.dash{border-top-style:dashed}
.leg i.box{height:10px;border:0;border-radius:2px;width:10px}
/* ============ REPORT (paper) ============ */
.rep-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.rep-wrap{display:flex;gap:18px;align-items:flex-start}
.rep-side{width:280px;flex:none;position:sticky;top:20px}
.rep-side textarea{width:100%;min-height:130px;resize:vertical}
@media (max-width:1300px){.rep-wrap{flex-direction:column}.rep-side{width:100%;position:static}}
.paper-scroll{overflow:auto;max-width:100%;flex:1}
.paper{width:820px;background:#fff;margin:0 auto;box-shadow:0 2px 14px rgba(16,24,40,.12);color:#101828;font-size:12.5px;line-height:1.5}
.pg{padding:34px 40px 30px;position:relative}
.pg + .pg{border-top:1px dashed #d0d5dd}
.r-head{display:flex;align-items:flex-start;gap:16px;padding-bottom:14px;border-bottom:3px solid var(--navy)}
.r-head .co{font-weight:800;font-size:15px;color:var(--navy);letter-spacing:.02em}
.r-head .co small{display:block;font-weight:500;font-size:11px;color:var(--text-2);letter-spacing:0}
.r-head .ttl{margin-left:auto;text-align:right}
.r-head .ttl h1{margin:0;font-size:20px;letter-spacing:-.01em;color:var(--navy)}
.r-head .ttl div{font-size:11.5px;color:var(--text-2)}
.r-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:8px;margin:14px 0 16px;overflow:hidden}
.r-meta div{padding:8px 12px;border-right:1px solid var(--line)} .r-meta div:last-child{border-right:0}
.r-meta label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.r-meta b{font-size:12.5px}
.r-sec{margin-top:18px;break-inside:avoid}
.r-sec h2{font-size:13px;margin:0 0 8px;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.r-sec h2::before{content:"";width:4px;height:14px;background:var(--accent);border-radius:2px}
.r-sum{background:#f6f9fd;border:1px solid #dbe6f5;border-radius:8px;padding:12px 14px;font-size:12.5px;color:#1d2939}
.r-sum p{margin:0 0 6px} .r-sum p:last-child{margin:0}
.r-chemhd{display:flex;align-items:center;gap:10px;margin:22px 0 10px;padding:9px 12px;background:#f8f9fb;border-radius:8px;border-left:4px solid}
.r-chemhd b{font-size:14px} .r-chemhd span{color:var(--text-2);font-size:12px}
.r-chemhd .b{margin-left:auto}
.r-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.r-kpi{border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.r-kpi label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);font-weight:600}
.r-kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px}
.r-kpi .v small{font-size:11px;font-weight:600;color:var(--text-2);margin-left:3px}
.r-kpi .s{font-size:11px;color:var(--text-2)}
.r-kpi.hl{background:var(--navy);border-color:var(--navy);color:#fff} .r-kpi.hl label,.r-kpi.hl .s,.r-kpi.hl .v small{color:#b9c8de}
.r-chart{border:1px solid var(--line);border-radius:8px;padding:12px 14px 8px}
.r-chart .ct{display:flex;align-items:baseline;gap:8px;font-weight:600;font-size:12.5px;margin-bottom:4px}
.r-chart .ct span{font-weight:400;color:var(--text-2);font-size:11px}
table.rt{width:100%;border-collapse:collapse;font-size:11.5px}
table.rt th{background:var(--navy);color:#fff;font-weight:600;text-align:left;padding:6px 8px;font-size:10.5px;letter-spacing:.02em;white-space:nowrap}
table.rt td{padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.rt tr:nth-child(even) td{background:#fafbfc}
table.rt .num{text-align:right;font-variant-numeric:tabular-nums}
table.rt tfoot td{font-weight:700;border-top:1.5px solid var(--navy);background:#fff}
.r-foot{display:flex;justify-content:space-between;margin-top:22px;padding-top:10px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}
.r-notes{border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;min-height:40px}
.pbar{position:relative;height:30px;border-radius:6px;background:#eef0f3;display:flex;overflow:hidden;gap:2px}
.pbar div{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden}
.pbar-leg{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-top:5px;font-variant-numeric:tabular-nums}
@media print{
  @page{size:A4 portrait;margin:9mm}
  body{background:#fff}
  .nav,.rep-bar,.rep-side,.page-h,#tip,.toast{display:none!important}
  main{padding:0}
  .paper{box-shadow:none;width:100%;margin:0}
  .paper-scroll{overflow:visible}
  .pg{padding:0 0 0}
  .pg + .pg{border-top:0;break-before:page}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

    <div id="navlinks"></div>
    <div class="nav-foot">
      <div class="lang-toggle" id="langT"><button data-lang="ko">한국어</button><button data-lang="en">English</button></div>
      <div class="who" id="who"></div>
      <div class="store-mode" id="storeMode"></div>
    </div>
  </nav>
  <main id="main"></main>
</div>

<script>
'use strict';
/* ================= utils ================= */
const CFG = window.QPO_CONFIG || {};
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => { if (v === '' || v == null) return null; const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/[,$\s]/g, '')); return isFinite(n) ? n : null; };
const N = v => num(v) || 0;
const r2 = v => Math.round(v * 100) / 100;
const fmt = (v, d = 0) => v == null || !isFinite(v) ? '–' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const money = v => v == null ? '–' : '$' + fmt(v, 2);
const pct = (v, d = 1) => v == null || !isFinite(v) ? '–' : (v * 100).toFixed(d) + '%';
const fmtK = v => Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(v % 1e6 ? 1 : 0) + 'M' : Math.abs(v) >= 1e3 ? Math.round(v / 1e3) + 'K' : String(Math.round(v));
/* dates: always ISO 'YYYY-MM-DD', math in UTC */
const toD = s => new Date(s + 'T00:00:00Z');
const iso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => iso(new Date(toD(s).getTime() + n * 864e5));
const diffDays = (a, b) => Math.round((toD(a) - toD(b)) / 864e5);
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

function weeklySVG(chem, asOfWe, L = LANG, opt = {}) {

  const avg = runRate(chem, asOfWe, set.rate === 'all' ? 'all' : nAvg);

  weeks.forEach((w, i) => {

    g += `<text x="${x + (bw - gap) / 2}" y="${Y(w.v) - 6}" text-anchor="middle" font-size="10.5" font-weight="${cur ? 700 : 500}" fill="${cur ? '#101828' : '#475467'}">${w.v ? fmtK(w.v) : '0'}</text>`;
    g += `<text x="${x + (bw - gap) / 2}" y="${H - m.b + 17}" text-anchor="middle" font-size="10.5" fill="${cur ? '#101828' : '#667085'}" font-weight="${cur ? 600 : 400}">${fd(w.d, L, true)}</text>`;
    g += `<rect class="hit" x="${x0 + i * bw}" y="${m.t}" width="${bw}" height="${H - m.t - m.b}" ${tipAttr(`<b>${L === 'ko' ? '주 마감' : 'Week ending'} ${fd(w.d, L)}</b><br>${chem}: ${fmt(w.v)} kg`)}/>`;

let RERENDER = false; const AFTER = {};
const pageHead = (title, sub = '', right = '') => `<div class="page-h"><h1>${title}</h1>${sub ? `<span class="sub">${sub}</span>` : ''}<span class="sp"></span>${right}</div>`;

/* ================= alerts ================= */
function alertsList() {
  const out = [], set = SET(), today = todayISO();
  set.chems.forEach(ch => {
    const po = activePO(ch, today);
    const hasPOs = S.pos.some(p => p.chem === ch && p.poNo);
    if (!po) { if (hasPOs || S.pos.some(p => p.chem === ch)) out.push({ lv: 'bad', ch, msg: LANG === 'ko' ? `${ch}: 활성 PO 없음 — 신규 PO 필요` : `${ch}: no active PO — new PO needed` }); return; }
    const c = poCalc(po, today), fc = forecast(po, today);
    const hasNext = c.next && c.next.poNo;
    if (c.rem < 0) out.push({ lv: 'bad', ch, msg: LANG === 'ko' ? `${ch} ${po.poNo}: 초과납품 ${fmt(-c.rem)} kg` : `${ch} ${po.poNo}: over-delivered ${fmt(-c.rem)} kg` });
    if (!hasNext && fc.trig != null && c.rem <= fc.trig) out.push({ lv: 'warn', ch, msg: LANG === 'ko' ? `${ch}: 잔여 ${fmt(c.rem)} kg ≤ 기준 ${fmt(fc.trig)} kg → Qcells에 신규 PO 요청` : `${ch}: remaining ${fmt(c.rem)} kg ≤ trigger ${fmt(fc.trig)} kg → request next PO from Qcells` });
    else if (!hasNext && fc.trigDate && diffDays(fc.trigDate, today) <= 14) out.push({ lv: 'warn', ch, msg: LANG === 'ko' ? `${ch}: ${fd(fc.trigDate)}경 신규 PO 요청 기준 도달 예상` : `${ch}: next-PO trigger expected around ${fd(fc.trigDate)}` });
    if (c.st === 'near' && !hasNext) out.push({ lv: 'warn', ch, msg: LANG === 'ko' ? `${ch} ${po.poNo}: 소진 임박 (잔여 ${fmt(c.rem)} kg)` : `${ch} ${po.poNo}: near completion (${fmt(c.rem)} kg left)` });
  });
  const od = S.deliveries.map(d => ({ d, c: delCalc(d) })).filter(x => x.c.pay === 'overdue');
  if (od.length) out.push({ lv: 'bad', msg: LANG === 'ko' ? `연체 입금 ${od.length}건 · ${money(od.reduce((s, x) => s + x.c.billed, 0))}` : `${od.length} overdue payment(s) · ${money(od.reduce((s, x) => s + x.c.billed, 0))}` });
  const bad = S.deliveries.map(d => ({ d, c: delCalc(d) })).filter(x => x.c.pay === 'over' || x.c.pay === 'short');
  if (bad.length) out.push({ lv: 'warn', msg: LANG === 'ko' ? `입금 차이 ${bad.length}건` : `${bad.length} payment difference(s)` });
  const chk = S.deliveries.filter(d => delCalc(d).chk !== 'ok');
  if (chk.length) out.push({ lv: 'bad', msg: LANG === 'ko' ? `PO 잔량 체크 오류 ${chk.length}건 (납품 내역 확인)` : `${chk.length} delivery PO check issue(s)` });
  return out;
}

  h += `<div class="card"><div class="card-h"><h3>${t('users')}</h3><span class="sp"></span><button class="btn sm" data-uact="add">＋ ${t('add')}</button></div><div class="card-b"><table class="t"><thead><tr><th>${t('name')}</th><th>${t('email')}</th><th>${t('role')}</th><th>${t('active')}</th><th>${t('lastLogin')}</th><th></th></tr></thead><tbody>
  ${[...ADM.users].sort((a, b) => ROLES.indexOf(a.role) - ROLES.indexOf(b.role)).map(u => `<tr><td>${esc(u.name || '')}</td><td class="muted">${esc(u.email)}</td><td>${roleSel(u, 'uRole')}</td><td><input type="checkbox" class="uAct" data-id="${esc(u.id)}" ${u.active ? 'checked' : ''} ${u.id === AUTH.email ? 'disabled' : ''}></td><td class="muted">${esc((u.lastLogin || '').slice(0, 16).replace('T', ' '))}</td><td>${u.id === AUTH.email ? '' : `<button class="btn sm danger" data-uact="del" data-id="${esc(u.id)}">${t('del')}</button>`}</td></tr>`).join('')}</tbody></table>
  <div class="muted" style="font-size:12px;margin-top:12px">${LANG === 'ko' ? '관리자: 사용자·설정·엑셀 가져오기 / 담당자: PO·납품 등록·수정, 보고 완료 기록 / 조회자: 조회·인쇄만' : 'Admin: users, settings, import · Editor: POs, deliveries, reports · Viewer: view & print'}</div></div></div>`;
  return h;
}
AFTER.users = () => {
  if (!CLOUD) return; const db = firebase.firestore(), col = db.collection(CP + 'users');
  $$('.uRole').forEach(s => s.onchange = async () => { if (!keepsAdmin(s.dataset.id, { role: s.value })) { render(); return toast(t('lastAdmin'), true); } await col.doc(s.dataset.id).update({ role: s.value }); toast(t('savedT')); });
  $$('.uAct').forEach(c => c.onchange = async () => { if (!keepsAdmin(c.dataset.id, { active: c.checked })) { render(); return toast(t('lastAdmin'), true); } await col.doc(c.dataset.id).update({ active: c.checked }); toast(t('savedT')); });
  $$('[data-uact]').forEach(b => b.onclick = async () => {
    const id = b.dataset.id, a = b.dataset.uact;
    try {
      if (a === 'approve') { const r = ADM.requests.find(x => x.id === id); const role = b.closest('tr').querySelector('.rqRole').value; await col.doc(id).set({ id, email: id, name: r?.name || '', role, active: true, createdAt: new Date().toISOString(), createdBy: AUTH.email }); await db.collection(CP + 'accessRequests').doc(id).delete(); toast(t('savedT')); }
      if (a === 'dismiss' && confirm(t('confirmDel'))) await db.collection(CP + 'accessRequests').doc(id).delete();
      if (a === 'del') { if (!keepsAdmin(id, null)) return toast(t('lastAdmin'), true); if (confirm(t('confirmDel'))) await col.doc(id).delete(); }
      if (a === 'add') modal(t('add'), `<div class="form"><div class="f full"><label>${t('email')}</label><input class="inp" id="nuE" placeholder="name@jnfam.onmicrosoft.com"></div><div class="f"><label>${t('name')}</label><input class="inp" id="nuN"></div><div class="f"><label>${t('role')}</label><select class="inp" id="nuR">${ROLES.map(r => `<option value="${r}" ${r === 'viewer' ? 'selected' : ''}>${t('role_' + r)}</option>`).join('')}</select></div></div>`, async () => { const e = $('#nuE').value.trim().toLowerCase(); if (!/@/.test(e)) return false; await col.doc(e).set({ id: e, email: e, name: $('#nuN').value.trim(), role: $('#nuR').value, active: true, createdAt: new Date().toISOString(), createdBy: AUTH.email }); toast(t('savedT')); });
    } catch (e) { toast(e.message, true); }
  });
};

/* ================= Online mode: shared team password (no login) ================= */
const PASS_KEY_LS = 'qpo_pass_key_v1', NAME_LS = 'qpo_user_name';
async function passDerive(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('jnfam-qcells-po|' + pw.trim()));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 24);
}
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch { } };
function passLock() { CloudStore.stop(); lsSet(PASS_KEY_LS, ''); COLS.forEach(c => S[c] = []); AUTH.role = ''; passGate('pass'); }
async function passOpen(key, create) {
  CloudStore.stop(); CP = `${CFG.collectionPrefix ?? 'qpo_'}${key}_`;
  passGate('init');
  try {
    await CloudStore.init();
    if (!S.settings.some(x => x.id === 'main')) {
      if (!create) { passGate('nodata', key); return; }
      await Store.put('settings', { ...DEF_SET });
    }
    lsSet(PASS_KEY_LS, key); AUTH.role = 'admin'; AUTH.name = lsGet(NAME_LS);
    passGate('ok'); render();
  } catch (e) { console.error(e); CloudStore.stop(); lsSet(PASS_KEY_LS, ''); AUTH.error = /permission/i.test(e.message) ? (LANG === 'ko' ? '비밀번호가 올바르지 않습니다.' : 'Incorrect password.') : e.message; passGate('error'); }
}
function passGate(state, key) {
  AUTH.status = state; let g = $('#gate');
  if (state === 'ok') { if (g) g.remove(); return; }
  if (!g) { g = document.createElement('div'); g.id = 'gate'; document.body.appendChild(g); }
  const ko = LANG === 'ko';
  g.innerHTML = `<div class="gate-card"><div class="logo" style="margin:0 auto 14px;width:46px;height:46px;font-size:14px">QPO</div><h2>${t('gateTitle')}</h2>
    ${state === 'init' ? `<p><span class="spin"></span> ${t('loading')}</p>` : ''}
    ${state === 'pass' ? `<p>${ko ? '팀 공용 비밀번호를 입력하세요. 이 브라우저에서는 한 번만 입력하면 됩니다.' : 'Enter the team password. This browser will remember it.'}</p>
      <form id="pForm" style="display:flex;flex-direction:column;gap:10px;text-align:left">
        <input class="inp" id="pPw" type="password" autocomplete="current-password" placeholder="${ko ? '비밀번호' : 'Password'}" style="padding:10px 12px" autofocus>
        <input class="inp" id="pName" value="${esc(lsGet(NAME_LS))}" placeholder="${ko ? '내 이름 (선택 · 보고 이력에 기록)' : 'Your name (optional, for report history)'}" style="padding:10px 12px">
        <button class="btn pri" style="justify-content:center;padding:10px">${ko ? '열기' : 'Open'}</button></form>` : ''}
    ${state === 'nodata' ? `<div class="warnbox" style="text-align:left">${ko ? '이 비밀번호로 저장된 데이터가 없습니다. 비밀번호가 맞는지 확인하세요.<br><br>처음 설정하는 경우에만 <b>새로 시작</b>을 누르세요.' : 'No data found for this password. Please check it.<br><br>Choose <b>Start new</b> only for first-time setup.'}</div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:16px"><button class="btn" id="pBack">${ko ? '다시 입력' : 'Try again'}</button><button class="btn pri" id="pNew">${ko ? '이 비밀번호로 새로 시작' : 'Start new with this password'}</button></div>` : ''}
    ${state === 'error' ? `<div class="errbox" style="text-align:left">${esc(AUTH.error || '')}</div><p></p><button class="btn" id="pBack">${ko ? '다시 입력' : 'Try again'}</button>` : ''}
    <div class="lang-toggle" style="max-width:200px;margin:22px auto 0;background:var(--surface-2);border:1px solid var(--line)"><button data-lang="ko" class="${LANG === 'ko' ? 'on' : ''}" style="color:var(--text-2)">한국어</button><button data-lang="en" class="${LANG === 'en' ? 'on' : ''}" style="color:var(--text-2)">English</button></div></div>`;
  $$('#gate .lang-toggle button').forEach(b => b.onclick = () => { LANG = b.dataset.lang; lsSet('qpo_lang', LANG); passGate(AUTH.status, key); });
  const f = $('#pForm'); if (f) { setTimeout(() => $('#pPw')?.focus(), 30); f.onsubmit = async e => { e.preventDefault(); const pw = $('#pPw').value; if (!pw.trim()) return; lsSet(NAME_LS, $('#pName').value.trim()); passOpen(await passDerive(pw), false); }; }
  if ($('#pBack')) $('#pBack').onclick = () => { lsSet(PASS_KEY_LS, ''); passGate('pass'); };
  if ($('#pNew')) $('#pNew').onclick = () => passOpen(key, true);
}
function passBoot() {
  firebase.initializeApp(CFG.firebase);
  Store = CloudStore;
  const k = lsGet(PASS_KEY_LS);
  if (k) passOpen(k, false); else passGate('pass');
}

/* ================= boot ================= */
document.documentElement.lang = LANG;
if (CLOUD) (PASS_MODE ? passBoot() : cloudBoot()); else LocalStore.init().then(render);
</script>
